name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# z-engine tracks one PHP minor per release line; the
# "~8.4.2 || ~8.5.0 || ~8.6.0@dev" constraint lets Composer resolve the line
# matching each runner's PHP, so the suite runs on PHP 8.4, 8.5 and 8.6 in
# parallel. Every leg is required: PHP 8.6 is a GA release, not an allowed
# failure. Until z-engine tags 8.6.0 its leg resolves the 8.6.x-dev line
# (master); "prefer-stable" switches it to the tag as soon as one exists.
jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5', '8.6']
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi
          ini-values: ffi.enable=1, zend.assertions=1, opcache.jit=off
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: Run test suite
        run: composer test

  static-analysis:
    name: PHPStan (level max, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5', '8.6']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi
          ini-values: ffi.enable=1, zend.assertions=1, opcache.jit=off
          coverage: none
      - uses: ramsey/composer-install@v4
      - run: composer phpstan

  coding-standards:
    name: Coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ffi
          ini-values: ffi.enable=1, zend.assertions=1, opcache.jit=off
          coverage: none
      - uses: ramsey/composer-install@v4
      - run: composer cs:check
